    <style>
        /* ================================== */
        /* إعدادات عامة وتصميم الألوان */
        /* ================================== */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 50px;
        }
        h1 { 
            text-align: center; 
            color: #58a6ff; 
            margin-bottom: 30px; 
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.4); 
            font-size: 32px;
            letter-spacing: 2px;
        }
        
        /* ================================== */
        /* شريط التنقل (التبويبات) */
        /* ================================== */
        .tabs-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tab-btn {
            background-color: transparent;
            color: #8b949e;
            border: 2px solid transparent;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn:hover {
            color: #c9d1d9;
            background-color: #21262d;
        }
        .tab-btn.active {
            color: #fff;
            background-color: #1f6feb;
            border-color: #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
        }

        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================================== */
        /* شريط البحث */
        /* ================================== */
        .search-container { text-align: center; margin-bottom: 40px; }
        input[type="text"] { 
            padding: 15px; 
            width: 90%; 
            max-width: 500px; 
            border: 1px solid #30363d; 
            border-radius: 30px; 
            background-color: #161b22; 
            color: #fff; 
            outline: none; 
            font-size: 16px; 
            text-align: center; 
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.4); }

        /* ================================== */
        /* تصميم الكروت (الدرعات، الصيانة، الإكسسوارات، البلس) */
        /* ================================== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
            justify-content: center;
        }
        .card {
            background-color: #161b22;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #30363d;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
        }
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            border-color: #58a6ff;
        }
        
        /* ألوان حدود الكروت من فوق */
        .border-ps5 { border-top: 4px solid #ffffff; }
        .border-ps4 { border-top: 4px solid #1f6feb; }
        .border-xbox { border-top: 4px solid #107c10; } 
        .border-maintain { border-top: 4px solid #f85149; }
        .border-acc { border-top: 4px solid #2ea043; }
        
        /* ألوان كروت البلس */
        .border-plus-ess { border-top: 4px solid #e3e3e3; }
        .border-plus-ext { border-top: 4px solid #fcc200; }
        .border-plus-pre { border-top: 4px solid #d2a8ff; }

        .card-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #fff; }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1117;
            margin: 12px 0;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #21262d;
            transition: 0.3s;
        }
        .price-row:hover { background: #1c2128; border-color: #30363d; }
        .item-name { font-weight: bold; font-size: 15px; color: #c9d1d9;}
        .item-price { font-weight: bold; color: #3fb950; font-size: 17px; }

        /* ================================== */
        /* تصميم جداول الألعاب */
        /* ================================== */
        .tables-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        @media (max-width: 900px) { .tables-wrapper { grid-template-columns: 1fr; } }

        .table-container { background-color: #161b22; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; }
        .section-title { font-size: 20px; text-align: center; padding: 15px; color: #fff; font-weight: bold; }
        .title-ps5 { background-color: #1a5ca6; }
        .title-ps4 { background-color: #003791; }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #30363d; border-left: 1px solid #30363d; font-size: 14px;}
        th:last-child, td:last-child { border-left: none; }
        
        .sub-header { background-color: #0d1117; color: #8b949e; font-size: 13px; }
        
        /* تلوين السطور بالتبادل */
        tbody tr:nth-child(odd) { background-color: #161b22; }
        tbody tr:nth-child(even) { background-color: #21262d; }
        tbody tr:hover { background-color: #30363d; } 

        .sold-out { color: #da3633; font-size: 13px; font-weight: bold; background-color: rgba(218, 54, 51, 0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; }
    </style>
</head>

        function renderCards(dataArray, containerId) {
            const container = document.getElementById(containerId);
            dataArray.forEach(group => {
                let itemsHTML = '';
                group.items.forEach(item => {
                    let displayPrice = item.price;
                    if (displayPrice.toLowerCase() === 'x' || displayPrice === '❌' || displayPrice === '-') {
                        displayPrice = '<span class="sold-out">نفدت ❌</span>';
                    } else {
                        displayPrice = displayPrice + ' ج.م';
                    }

                    itemsHTML += `
                        <div class="price-row">
                            <span class="item-name" style="color:${item.color}">${item.label}</span>
                            <span class="item-price">${displayPrice}</span>
                        </div>
                    `;
                });
                container.innerHTML += `
                    <div class="card ${group.theme}">
                        <div class="card-title">${group.name}</div>
                        ${itemsHTML}
                    </div>
                `;
            });
        }

        renderCards(psPlusData, "psPlusContainer");
        renderCards(controllersData, "controllersContainer");
        renderCards(maintenanceData, "maintenanceContainer");
        renderCards(accessoriesData, "accessoriesContainer");

        function formatPrice(val) {
            if (val.toLowerCase() === 'x' || val === '❌' || val === '-') return '<span class="sold-out">نفدت ❌</span>';
            return `<span style="color: #3fb950; font-weight: bold;">${val}</span>`;
        }

        function renderTable(gamesArray, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            gamesArray.forEach(game => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-weight: bold; color: #fff; text-align: left;" dir="ltr">${game.name}</td>
                    <td>${formatPrice(game.off)}</td>
                    <td>${formatPrice(game.pr)}</td>
                    <td>${formatPrice(game.sc)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable(ps5Games, "ps5Body");
        renderTable(ps4Games, "ps4Body");

        function searchTable() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let tables = [document.getElementById("ps5Body"), document.getElementById("ps4Body")];

            tables.forEach(tbody => {
                let tr = tbody.getElementsByTagName("tr");
                for (let i = 0; i < tr.length; i++) {
                    let td = tr[i].getElementsByTagName("td")[0];
                    if (td) {
                        let txtValue = td.textContent || td.innerText;
                        if (txtValue.toUpperCase().indexOf(input) > -1) {
                            tr[i].style.display = "";
                        } else {
                            tr[i].style.display = "none";
                        }
                    }       
                }
            });
        }
